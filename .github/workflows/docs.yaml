name: Docs

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pages: write

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  LUPNT_DOCS_JOBS: 4

jobs:
  build-docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.68.1
          cache: true
          frozen: true

      - uses: actions/cache@v4
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - uses: actions/cache@v4
        id: cache-lupnt-data
        with:
          path: data/LuPNT_data
          key: LuPNT_data-${{ vars.LUPNT_DATA_CACHE_DATE }}

      - name: Download LuPNT_data
        run: |
          if [ -f data/LuPNT_data/gnss/igs20.atx ] && [ -f data/LuPNT_data/tle/2023_06_09/gps_2023_06_09.txt ]; then
            exit 0
          fi
          rm -rf data/LuPNT_data
          mkdir -p data
          curl -L https://bit.ly/LuPNT_data -o LuPNT_data.zip
          unzip -q LuPNT_data.zip
          mv LuPNT_data data/LuPNT_data
          rm LuPNT_data.zip

      - name: Build docs
        run: pixi run build-docs

      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: ./build/docs

      - name: Deploy
        id: deployment
        if: github.event_name == 'push'
        uses: actions/deploy-pages@v4
