repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        args: ["--style=file"]

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: [pyyaml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      # Block accidental large files. Interactive plots/scenes are hosted on
      # lupnt-doc-assets (not committed); the tutorial notebooks keep only small
      # optimized figures, so ~1 MB is the largest legitimate file here.
      - id: check-added-large-files
        args: ["--maxkb=1536"]

  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black
        args: [--target-version=py310]
        additional_dependencies: [black==24.8.0]
        env:
          BLACK_DISABLE_MYPYC: "1"

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        exclude: "source/python/pylupnt/_pylupnt.pyi"
        args: ["--line-length=100"]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        # Keep cell outputs for the tutorial notebooks (python/examples/exN_*.ipynb):
        # the documentation renders them with nbsphinx (nbsphinx_execute = "never"),
        # so their stored figures/tables must survive the commit. All other
        # notebooks (projects/, GNSS helpers, subdirectories) are still stripped.
        exclude: '^python/examples/ex[0-9]+_[^/]*\.ipynb$'
