designs:
  lunar_gnss_baseline:
    receiver_tracking:
      carrier_loop_bandwidth_hz: 1.0
      integration_time_s: 0.02
      front_end_bandwidth_factor: 2.0
      code_loop_bandwidth_hz: 0.7
      frequency_loop_bandwidth_hz: 0.2
      early_late_spacing_chips: 0.1
    link_budget:
      setup_transmitters: false
      apply_cn0_threshold: false
      cn0_threshold_dbhz: 15.0
      use_cn0_measurement_sigmas: false
    plasma_mismatch:
      filter_pseudorange_noise_inflation_m: 0.0
      filter_doppler_noise_inflation_hz: 0.0

  lunar_gnss_link_budget:
    receiver_tracking:
      carrier_loop_bandwidth_hz: 1.0
      integration_time_s: 0.02
      front_end_bandwidth_factor: 2.0
      code_loop_bandwidth_hz: 0.7
      frequency_loop_bandwidth_hz: 0.2
      early_late_spacing_chips: 0.1
    link_budget:
      setup_transmitters: true
      apply_cn0_threshold: true
      cn0_threshold_dbhz: 15.0
      use_cn0_measurement_sigmas: true
    plasma_mismatch:
      filter_pseudorange_noise_inflation_m: 1.0
      filter_doppler_noise_inflation_hz: 0.02
