simulation:
  seed: 42
  monte_carlo_runs: 1
  duration_s: 180.0
  dt_s: 1.0
  ephemeris_dt_s: 30.0
  start_epoch_utc: "2025-01-01T00:00:00"
  output_dir: output/gnss_filtering

pipeline:
  links_file: output/gnss_filtering/precomputed_links.csv
  delays_file: output/gnss_filtering/precomputed_delays.csv

design:
  database: gnss_designs.yaml
  name: lunar_gnss_link_budget

receiver_app:
  # The receiver application is called on local clock ticks, then mapped to TDB
  # for propagation and measurement generation.
  rate_hz: 1.0

truth:
  # ELFO from projects/Ephemeris/src/orbit_manager.py, initialized in MOON_OP
  # then converted to MOON_CI at start_epoch_utc.
  receiver_a_m: 6541400.0
  receiver_ecc: 0.6
  receiver_inc_rad: 1.1431906601
  receiver_raan_rad: 1.0471975512
  receiver_argp_rad: 1.5707963268
  receiver_mean_anomaly_rad: 0.0
  clock_bias_s: 2.0e-6
  clock_drift_sps: 1.0e-10

constellation:
  use_all_gps: true
  include_galileo: false
  auto_select_sp3: true
  gps_prns: []
  galileo_prns: []

plasma:
  simulate_truth: true
  model_in_filter: false
  raytrace:
    step_size_km: 200.0
    correction: false
    fine_correction: false
    straight_ray: true
    compute_higher_order: true
    use_adaptive_step: true
    use_fortran_gcpm: true
    cutoff_radius_re: 4.0
    gradient_step_km: 1.0
    correction_tolerance_m: 100.0
    kp: 3.0
    integrator: RK4
    correction_method: neldermead
  filter_pseudorange_noise_inflation_m: 0.75
  filter_doppler_noise_inflation_hz: 0.02

dynamics:
  moon_gravity_degree_truth: 20
  moon_gravity_order_truth: 20
  moon_gravity_degree_filter: 12
  moon_gravity_order_filter: 12
  moon_gravity_degree_constellation: 12
  moon_gravity_order_constellation: 12
  include_earth: true
  include_sun: true
  use_relativity: true
  use_srp_truth: true
  use_srp_filter: true
  # SRP ballistic coefficient, Cr * area / mass [m^2/kg].
  srp_coeff_truth_m2_kg: 0.0021176470588235294
  srp_coeff_filter_m2_kg: 0.0021176470588235294

measurements:
  use_pseudorange: true
  use_doppler: true
  use_tdcp: false

filter:
  estimate_srp_coefficient: false
  initial_srp_coeff_m2_kg: 0.0019
  initial_position_sigma_m: 20.0
  initial_velocity_sigma_mps: 0.02
  initial_clock_bias_sigma_s: 1.0e-6
  initial_clock_drift_sigma_sps: 1.0e-11
  initial_srp_coeff_sigma_m2_kg: 0.0005
  process_accel_sigma_mps2: 1.0e-7
  process_clock_bias_sigma_s_sqrt_s: 1.0e-11
  process_clock_drift_sigma_sps_sqrt_s: 1.0e-13
  process_srp_coeff_sigma_m2_kg_sqrt_s: 1.0e-10
  integration_step_s: 20.0
