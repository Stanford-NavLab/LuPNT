# Configuration for ex_plasma_equatorial_slice_custom.
# Units follow the plasma library convention: distance is in Earth radii for
# GCPM inputs, and calendar fields are UTC-like model inputs.
year = 2025
month = 3
day = 1
hour = 12
minute = 0
second = 0

# Set kp < 0 in code paths that support automatic Kp loading. These slice
# examples pass Kp directly to GCPM, so keep an explicit demonstration value.
kp = 3.0

# Rz12/F10.7 proxy used by IRI-2007 inside GCPM. Use a negative value to let
# the plasma data tables choose the model value for the epoch.
rz12 = 50.0

# The C++ GCPM implementation is repeatable and preferred for new simulations.
# Enable run_fortran only when comparing with the original GCPM wrapper.
run_cpp = true
run_fortran = false

# Ignored by the equatorial example, but accepted by the shared config parser.
only_xz = true
