# Fully DISTRIBUTED ISL ODTS scenario (Example 8, distributed variant).
# Each satellite is a `Spacecraft` agent self-propagating its orbit+clock truth and
# hosting a `SatelliteOdtsApp`: it generates its OWN crosslink + station-aiding
# measurements (pulling neighbour/station truth via the agent graph), runs its onboard
# Schmidt-EKF, and exchanges consider-states with neighbours over the Publish/Subscribe
# bus (one-interval latency). A `SurfaceStationManager` hosts the centralized ground
# filter (`GroundOdtsApp`) as a baseline.

