# Feature Extractor Configurations
# These configs are used with FeatureExtractor::FromConfig(config)
# Enum values can be specified as either strings or integers

# SIFT - Scale-Invariant Feature Transform
# Best for: High-quality matching, scale/rotation invariance
# Descriptor: 128-dim float (L2 norm)
# Speed: Slow
sift:
  class: SiftFeatureExtractor
  n_features: 0  # 0 = no limit
  n_octave_layers: 3  # Number of layers per octave
  contrast_threshold: 0.04  # Threshold for filtering weak features
  edge_threshold: 10.0  # Threshold for filtering edge-like features
  sigma: 1.6  # Gaussian sigma for octave 0

sift_high_quality:
  class: SiftFeatureExtractor
  n_features: 2000
  n_octave_layers: 4
  contrast_threshold: 0.02  # Lower = more features
  edge_threshold: 10.0
  sigma: 1.6

sift_fast:
  class: SiftFeatureExtractor
  n_features: 500
  n_octave_layers: 3
  contrast_threshold: 0.06  # Higher = fewer, stronger features
  edge_threshold: 10.0
  sigma: 1.6

# ORB - Oriented FAST and Rotated BRIEF
# Best for: Real-time applications, computational efficiency
# Descriptor: 256-bit binary (Hamming norm)
# Speed: Very fast
orb:
  class: OrbFeatureExtractor
  n_features: 500
  scale_factor: 1.2
  n_levels: 8  # Number of pyramid levels
  edge_threshold: 31  # Border size where features not detected
  first_level: 0  # Level to put source image
  WTA_K: 2  # Number of points for BRIEF descriptor
  score_type: HARRIS_SCORE  # Can be "HARRIS_SCORE" or "FAST_SCORE" or int (0/1)
  patch_size: 31  # Size of patch for descriptor
  fast_threshold: 20  # FAST detection threshold

orb_high_density:
  class: OrbFeatureExtractor
  n_features: 2000
  scale_factor: 1.2
  n_levels: 8
  edge_threshold: 31
  first_level: 0
  WTA_K: 2
  score_type: HARRIS_SCORE
  patch_size: 31
  fast_threshold: 15  # Lower = more features

orb_fast:
  class: OrbFeatureExtractor
  n_features: 500
  scale_factor: 1.2
  n_levels: 4  # Fewer levels = faster
  edge_threshold: 31
  first_level: 0
  WTA_K: 2
  score_type: FAST_SCORE  # Faster scoring
  patch_size: 31
  fast_threshold: 25  # Higher = fewer features

# AKAZE - Accelerated-KAZE
# Best for: Non-linear scale spaces, robust feature detection
# Descriptor: Binary (Hamming norm)
# Speed: Fast
akaze:
  class: AkazeFeatureExtractor
  descriptor_type: DESCRIPTOR_MLDB  # Can be string or int (2-5)
  descriptor_size: 0  # 0 = full size
  descriptor_channels: 3
  threshold: 0.001  # Detector response threshold
  n_octaves: 4
  n_octave_layers: 4
  diffusivity: DIFF_PM_G2  # Can be string or int (0-3)
  max_points: -1  # -1 = no limit

akaze_high_quality:
  class: AkazeFeatureExtractor
  descriptor_type: DESCRIPTOR_MLDB
  descriptor_size: 0
  descriptor_channels: 3
  threshold: 0.0005  # Lower = more features
  n_octaves: 5
  n_octave_layers: 5
  diffusivity: DIFF_PM_G2
  max_points: 2000

akaze_fast:
  class: AkazeFeatureExtractor
  descriptor_type: DESCRIPTOR_MLDB_UPRIGHT  # No rotation invariance = faster
  descriptor_size: 0
  descriptor_channels: 3
  threshold: 0.002  # Higher = fewer features
  n_octaves: 3
  n_octave_layers: 3
  diffusivity: DIFF_PM_G1
  max_points: 500

# BRISK - Binary Robust Invariant Scalable Keypoints
# Best for: Fast binary matching with scale/rotation invariance
# Descriptor: 512-bit binary (Hamming norm)
# Speed: Very fast
brisk:
  class: BriskFeatureExtractor
  thresh: 30  # AGAST detection threshold
  octaves: 3  # Detection octaves (0 = single scale)
  pattern_scale: 1.0  # Scale for sampling pattern

brisk_high_density:
  class: BriskFeatureExtractor
  thresh: 20  # Lower = more features
  octaves: 4
  pattern_scale: 1.0

brisk_fast:
  class: BriskFeatureExtractor
  thresh: 40  # Higher = fewer features
  octaves: 2
  pattern_scale: 1.0

# Default configuration
default:
  class: SiftFeatureExtractor
  n_features: 1000
  n_octave_layers: 3
  contrast_threshold: 0.04
  edge_threshold: 10.0
  sigma: 1.6
