# Feature Matcher Configurations
# These configs are used with FeatureMatcher::FromConfig(config)

# Brute Force Matcher with L2 norm (for SIFT descriptors)
bf_l2:
  class: BFMatcher
  norm_type: 4  # cv::NORM_L2
  cross_check: false
  ratio_threshold: 0.75  # Lowe's ratio test threshold

# Brute Force Matcher with Hamming norm (for ORB, BRISK, AKAZE descriptors)
bf_hamming:
  class: BFMatcher
  norm_type: 6  # cv::NORM_HAMMING
  cross_check: false
  ratio_threshold: 0.75

# Brute Force Matcher with cross-check (slower but more accurate)
bf_crosscheck:
  class: BFMatcher
  norm_type: 4  # cv::NORM_L2
  cross_check: true
  ratio_threshold: 0.75

# FLANN-based Matcher for L2 descriptors (SIFT)
flann_l2:
  class: FlannBasedMatcher
  norm_type: 4  # cv::NORM_L2
  ratio_threshold: 0.75
  cross_check: false

# FLANN-based Matcher for binary descriptors (ORB, BRISK, AKAZE)
flann_hamming:
  class: FlannBasedMatcher
  norm_type: 6  # cv::NORM_HAMMING
  ratio_threshold: 0.75
  cross_check: false

# High quality matching (lower ratio threshold = stricter matching)
high_quality:
  class: BFMatcher
  norm_type: 4  # cv::NORM_L2
  cross_check: false
  ratio_threshold: 0.6  # Stricter threshold

# Fast matching (higher ratio threshold = more matches)
fast:
  class: BFMatcher
  norm_type: 6  # cv::NORM_HAMMING
  cross_check: false
  ratio_threshold: 0.85  # More permissive

# Default configuration
default:
  class: BFMatcher
  norm_type: 4  # cv::NORM_L2
  cross_check: false
  ratio_threshold: 0.75
