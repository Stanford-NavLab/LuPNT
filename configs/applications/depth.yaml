raft_stereo:
  class: RAFTStereo
  checkpoint: ./pretrained/depth_stereo/raftstereo-eth3d.pth
  save_numpy: false
  mixed_precision: false
  valid_iters: 32
  hidden_dims: [128, 128, 128]
  corr_implementation: reg
  shared_backbone: false
  corr_levels: 4
  corr_radius: 4
  n_downsample: 2
  context_norm: batch
  slow_fast_gru: false
  n_gru_layers: 3

iae_stereo:
  class: EAIStereo
  checkpoint: ./pretrained/depth_stereo/eai-stereo.pth
  save_numpy: false
  mixed_precision: false
  valid_iters: 32
  hidden_dims: [128, 128, 128]
  corr_implementation: reg_cuda
  shared_backbone: true
  corr_levels: 4
  corr_radius: 4
  n_downsample: 2
  slow_fast_gru: false
  n_gru_layers: 3

crestereo:
  class: CREStereo
  checkpoint: ./pretrained/depth_stereo/crestereo_eth3d.pth
  max_disp: 256
  test_mode: true
  iters: 20

bm:
  class: BM
  num_disparities: 128
  block_size: 9
  pre_filter_cap: 31
  pre_filter_size: 9
  uniqueness_ratio: 5
  speckle_window_size: 200
  speckle_range: 2
  disp12_max_diff: 1

# minDisparity=0,
#     numDisparities=128,
#     blockSize=5,
#     P1=8 * 3 * 5**2,
#     P2=32 * 3 * 5**2,
#     disp12MaxDiff=1,
#     uniquenessRatio=10,
#     speckleWindowSize=200,
#     speckleRange=4,
#     preFilterCap=63,
#     mode=cv2.STEREO_SGBM_MODE_SGBM_3WAY,
sgbm:
  class: SGBM
  min_disparity: 0
  num_disparities: 128
  block_size: 5
  P1: 8 * 3 * 5**2
  P2: 32 * 3 * 5**2
  disp12_max_diff: 1
  uniqueness_ratio: 10
  speckle_window_size: 200
  speckle_range: 4
  pre_filter_cap: 63
  mode: cv2.STEREO_SGBM_MODE_SGBM_3WAY


transformer_depth:
  class: DepthTransformer
  model: dpt
  scale: absolute
  size: small


depth_models:
  depth_anything:
    small: LiheYoung/depth-anything-small-hf
    base: LiheYoung/depth-anything-base-hf
    large: LiheYoung/depth-anything-large-hf
  depth_anything_v2:
    small: depth-anything/Depth-Anything-V2-Small-hf
    base: depth-anything/Depth-Anything-V2-Base-hf
    large: depth-anything/Depth-Anything-V2-Large-hf
  dpt: Intel/dpt-large
  dpt-ade: Intel/dpt-large-ade
  depth_pro: apple/DepthPro-hf
  glpn: vinvino02/glpn-nyu
  zoedepth: omerbt/zoedepth
