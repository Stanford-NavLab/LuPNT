# Agent-based ground-station orbit determination scenario (Example 7).
#
# An ELFO target satellite (`sat`) is tracked in range and range-rate by the three
# Deep Space Network complexes -- Goldstone (`DSS14`), Canberra (`DSS43`), Madrid
# (`DSS63`). Each station is a `GroundStation` agent running a
# `GroundStationTrackingApp` (a sensor: it generates its own visibility-gated
# observations of the target). The observations are pushed to a `GroundStationManager`
# agent (`gs_manager`), whose `GroundStationManagerApp` aggregates them and runs the
# centralized batch + SRIF/smoother orbit-determination filter.
#
# The shared physical environment lives in the top-level `world:` block: epoch,
# integration frame, and force model. The target and the estimator share this one
# force model, so there is no truth/filter model mismatch. Add more stations or
# targets simply by listing more agents.
#
# Each tracking app can optionally add Earth signal-path delays (troposphere,
# ionosphere, relativistic Shapiro) and a solid Earth tide station displacement to
# its truth observables -- see the `apply_*` keys on `DSS14` below. They default off,
# so the baseline scenario tracks a pure geometric range.

name: ground_station_odts
epoch: "2026-01-01T00:00:00"
duration: "36:00:00"          # 36 h (~2.7 ELFO orbits)
log_level: INFO

# ---- Shared, read-only environment -------------------------------------------
world:
  frame: MOON_CI
  force_model:                # NBodyDynamics-style force model (2x2 Moon + Earth/Sun + SRP)
    integrator: RKF45
    dt: 10.0
    max_iter: 1000
    abstol: 1.0e-6
    reltol: 1.0e-10
    autodiff: true            # analytic state-transition matrix for the estimator
    mass: 10.0                # [kg]  } SRP: CR * area / mass
    area: 0.02                # [m^2] }
    CR: 1.8
    bodies:
      - MOON: { n: 2, m: 2 }
      - EARTH: {}
      - SUN: {}

agents:
  # ---- Target: ELFO satellite (same frozen orbit as Example 1) ----
  sat:
    class: Satellite
    frequency: 0.0033333333333333   # 1/300 Hz: log truth at the measurement cadence
    # No `dynamics:` block -> the satellite inherits the shared `world.force_model`
    # as its truth dynamics (STM disabled). Declare a per-agent `dynamics:` block
    # only to override the common physics for this agent.
    initial_state:
      class: ClassicalOE
      frame: MOON_OP
      a: 6541400.0                  # [m]
      e: 0.6
      i: 56.2                       # [deg]
      Omega: 0.0
      omega: 90.0
      M: 0.0

  # ---- Estimator: ground-segment manager (centralized OD filter) ----
  gs_manager:
    class: GroundStationManager
    application:
      class: GroundStationManagerApp
      target: sat
      obs_interval_s: 300.0         # uniform grid for the time-series outputs
      seed: 42
      initial_position_sigma_m: 2000.0
      initial_velocity_sigma_mps: 0.5
      batch_max_iterations: 10
      batch_convergence_tol: 1.0e-3
      run_srif: true
      srif_use_process_noise: true
      srif_accel_psd: 3.0e-13

      # Estimation-side handling of the sensor's signal-path / station-location corrections.
      # The deterministic terms are computable and are modelled out in full; the media are only
      # partially calibrated and the uncancelled remainder inflates the range noise. These are
      # no-ops unless the trackers actually inject the corresponding correction.
      model_shapiro: true            # subtract the (deterministic) Shapiro delay in the estimator
      model_solid_earth_tide: true   # apply the tide displacement to the modelled station position
      troposphere_cancel_fraction: 0.8   # fraction of the troposphere delay calibrated out [0..1]
      ionosphere_cancel_fraction: 0.8    # fraction of the ionosphere delay calibrated out [0..1]
      residual_delay_noise_scale: 1.0    # uncancelled tropo+iono delay x this -> extra range 1-sigma

      # Optional filter-dynamics override. Without these, both estimators inherit the shared
      # `world.force_model` (truth == filter). Provide `filter_dynamics:` (an NBodyDynamics-style
      # force-model block) to run BOTH the batch and the sequential filter at a different fidelity
      # than truth, or `batch_dynamics:` / `sequential_dynamics:` to set each independently, e.g.:
      # filter_dynamics:
      #   frame: MOON_CI
      #   integrator: RKF45
      #   bodies:
      #     - MOON: { n: 8, m: 8 }   # coarser than the 16x16 truth in world.force_model
      #     - EARTH: {}
      #     - SUN: {}

  # ---- Trackers: DSN 70 m ground stations ----
  # (yaml-cpp does not support merge keys, so each tracking app is written out in full.)
  DSS14:
    class: GroundStation
    latitude_deg: 35.426456
    longitude_deg: 243.110461
    altitude_m: 1001.39
    application:
      class: GroundStationTrackingApp
      frequency: 0.0033333333333333   # 1/300 Hz measurement cadence
      target: sat
      manager: gs_manager
      elevation_mask_deg: 10.0
      use_range: true
      use_range_rate: true
      range_sigma_m: 10.0
      range_rate_sigma_mps: 1.0e-3
      seed: 42

      # Signal-path / station-location corrections added to this sensor's *truth* observable
      # (Earth-station tracking of a lunar target). The estimator models most of them back out
      # (see the gs_manager `model_*` / `*_cancel_fraction` keys); what it cannot calibrate is
      # left as a realistic residual. Path delays (troposphere, ionosphere, Shapiro) bias the
      # range; the solid Earth tide displaces the station and so affects range and range-rate.
      apply_troposphere: true         # Saastamoinen zenith delay + 1/sin(el) mapping (~2.4 m
                                      #   zenith, ~14 m at 10 deg). Unset pressure/temperature
                                      #   default to the standard atmosphere at the station height.
      # troposphere_pressure_hpa: 1013.25
      # troposphere_temperature_k: 288.15
      # troposphere_humidity_pct: 50.0
      apply_ionosphere: true          # thin-shell VTEC delay 40.3*STEC/f^2 (dispersive, so a
                                      #   dual-frequency link cancels it). ~0.06 m at 10 TECU,
                                      #   X-band zenith; scales as 1/f^2.
      # ionosphere_vtec_tecu: 10.0
      # signal_frequency_hz: 8.4e9    # X-band downlink
      apply_shapiro: true             # relativistic (Sun + Earth) light-time delay, a few m
      apply_solid_earth_tide: true    # degree-2 solid Earth tide station displacement (<~0.3 m)

  DSS43:
    class: GroundStation
    latitude_deg: -35.402424
    longitude_deg: 148.981267
    altitude_m: 688.867
    application:
      class: GroundStationTrackingApp
      frequency: 0.0033333333333333
      target: sat
      manager: gs_manager
      elevation_mask_deg: 10.0
      use_range: true
      use_range_rate: true
      range_sigma_m: 10.0
      range_rate_sigma_mps: 1.0e-3
      seed: 42
      apply_troposphere: true         # same Earth signal-path + tide corrections as DSS14
      apply_ionosphere: true
      apply_shapiro: true
      apply_solid_earth_tide: true

  DSS63:
    class: GroundStation
    latitude_deg: 40.431210
    longitude_deg: 355.751991
    altitude_m: 864.816
    application:
      class: GroundStationTrackingApp
      frequency: 0.0033333333333333
      target: sat
      manager: gs_manager
      elevation_mask_deg: 10.0
      use_range: true
      use_range_rate: true
      range_sigma_m: 10.0
      range_rate_sigma_mps: 1.0e-3
      seed: 42
      apply_troposphere: true         # same Earth signal-path + tide corrections as DSS14
      apply_ionosphere: true
      apply_shapiro: true
      apply_solid_earth_tide: true
