name: lunar_gnss_odts
epoch: '2026-01-01T02:00:00'
duration: '14:00:00'
log_level: INFO
world:
  frame: MOON_CI
  # Shared TRUTH force model. Each `bodies` entry is `BODY: {n: <degree>, m: <order>}` for a
  # spherical-harmonic gravity field; omit n/m (or use `{}`) for point-mass (central) gravity.
  force_model:
    integrator: RKF45
    dt: 30.0
    max_iter: 20
    abstol: 1.0e-12
    reltol: 1.0e-12
    autodiff: false
    bodies:
    - MOON: {n: 20, m: 20}   # 20x20 lunar gravity field
    - EARTH: {}              # third body, point-mass (no spherical harmonics)
    - SUN: {}                # third body, point-mass (no spherical harmonics)
  # Ionosphere/plasmasphere signal-delay environment (a shared truth property, so it lives here
  # under `world:` rather than in the receiver app). simulate_truth adds it to the truth signal;
  # model_in_filter toggles whether the onboard filter models it.
  plasma:
    simulate_truth: true
    model_in_filter: false
    raytrace:
      kp: 3.0
      rz12: 50.0
agents:
  receiver:
    class: Spacecraft
    frequency: 0.0
    dynamics:
      class: NBodyDynamics
      frame: MOON_CI
      integrator: RKF45
      dt: 20.0
      max_iter: 20
      abstol: 1.0e-12
      reltol: 1.0e-12
      use_relativity: true
      mass: 1.0
      area: 0.002
      CR: 1.0
      bodies:
      - MOON:
          n: 20
          m: 20
      - EARTH: {}
      - SUN: {}
    clock:
      model: OCXO
      seed: 42
    initial_state:
      class: ClassicalOE
      frame: MOON_OP
      a: 6541400.0
      e: 0.6
      i: 65.5
      Omega: 60.0
      omega: 90.0
      M: 0.0
      clock_bias_s: 2.0e-06
      clock_drift_sps: 1.0e-10
    application:
      class: LunarGnssOdtsApp
      simulation:
        seed: 42
        start_epoch_utc: '2026-01-01T02:00:00'
        duration_s: 47474.87548235426
        dt_s: 1.0
        ephemeris_dt_s: 30.0
        output_dir: output/python_examples/ex6_gnss_odts_data
        precompute_progress_interval_s: 5.0
        run_progress_interval_epochs: 1000
        debug_print_matrix_epochs: 3
        debug_print_matrix_max_rows: 8
        precompute_num_threads: 0
      pipeline:
        links_file: output/python_examples/ex6_gnss_odts_data/precomputed_links.csv
        delays_file: output/python_examples/ex6_gnss_odts_data/precomputed_delays.csv
      receiver_app:
        rate_hz: 1.0
      constellation:
        sp3_directory: data/LuPNT_data/ephemeris/gnsslibpy/sp3
        antex_file: data/LuPNT_data/gnss/igs20.atx
        auto_select_sp3: true
        use_all_gps: true
        include_galileo: true
        brdc_directory: data/LuPNT_data/ephemeris/gnsslibpy/brdc
        use_broadcast_ephemeris: true
        debias_broadcast_clock: true
        debias_qzss_radial: true
      design:
        custom:
          receiver_tracking:
            carrier_loop_bandwidth_hz: 1.0
            integration_time_s: 0.02
            front_end_bandwidth_factor: 2.0
            code_loop_bandwidth_hz: 0.7
            frequency_loop_bandwidth_hz: 0.2
            early_late_spacing_chips: 0.1
          link_budget:
            setup_transmitters: true
            receiver_antenna: moongpsr
            apply_cn0_threshold: true
            cn0_acquisition_threshold_dbhz: 22.0
            cn0_tracking_threshold_dbhz: 20.0
            use_cn0_measurement_sigmas: true
            # true -> transmitter CN0 geometry uses the block-specific dedicated eclipse
            # yaw-steering law (GPS/Galileo); false (default) = nominal Sun-pointing frame.
            tx_yaw_dedicated: false
      dynamics:
        moon_gravity_degree_filter: 18
        moon_gravity_order_filter: 18
        include_earth: true
        include_sun: true
        use_relativity: true
        use_srp_filter: true
      measurements:
        use_pseudorange: true
        use_doppler: false
        # TDCP on by default: with the 0.20 m inflation below it is consistent and improves
        # accuracy over pseudorange-only (see notebook section 7c/7d). Set false to compare.
        use_tdcp: true
        use_ionosphere_free: true
        # TDCP mode. Default (false) = single-frequency (GPS L1 / Galileo E1) carrier phase.
        # Unlike the pseudorange it then gets NO ionosphere-free cancellation: the truth carrier
        # retains the ray-traced plasmaspheric delay, whose epoch-to-epoch CHANGE (measured
        # RMS 3.6 cm, p99 14 cm, tail to ~0.85 m over this 14 h arc) is a real error the filter
        # (plasma model_in_filter: false) never models. Setting this true forms TDCP from the
        # L1+L5 / E1+E5a ionosphere-free carrier combination, cancelling that delay to ~1 mm --
        # BUT it then requires both frequencies on a satellite, which at this lunar geometry
        # roughly halves TDCP coverage (5.4 -> 2.3 measurements/epoch, since far more satellites
        # carry L1 than L1+L5). Because the consistency-limiting residual here is the
        # frequency-INDEPENDENT broadcast-ephemeris + receiver-clock error (~0.15 m equivalent,
        # which IF cannot cancel), the inflation needed for consistency already exceeds the 3.6 cm
        # plasma, so cancelling plasma buys nothing while the coverage loss hurts: single-frequency
        # TDCP @ 0.20 m wins here (pos RMS 39.6 vs 51.1 m, final 16.1 vs 19.7 m). Keep IF-TDCP for
        # regimes where plasma dominates and dual-frequency coverage is good. See the ex6 notebook.
        tdcp_ionosphere_free: false
        filter_pseudorange_noise_inflation_m: 10.0
        # Filter-only TDCP measurement-sigma inflation [m]. At the raw carrier precision (~1 cm)
        # the single-frequency EKF treats the unmodeled plasma-delay change as state error, chases
        # it, and diverges (pos RMS 768 m, 25-49x overconfident). 0.20 m covers the plasma-delta
        # distribution AND the broadcast/clock residual, restoring consistency (~1.6x, matching the
        # pseudorange-only baseline) while improving accuracy (pos RMS 54.6 -> 39.6 m, final
        # 23.2 -> 16.1 m). With tdcp_ionosphere_free the plasma is gone, but the broadcast/clock
        # residual still sets a ~0.1-0.15 m floor.
        filter_tdcp_noise_inflation_m: 0.20
        pseudorange_min_tangent_altitude_m: 1000.0
        tdcp_min_tangent_altitude_m: 4000.0
      filter:
        estimate_srp_coefficient: true
        initial_srp_coeff_m2_kg: 0.001
        initial_position_sigma_m: 100.0
        initial_velocity_sigma_mps: 0.1
        initial_clock_bias_sigma_s: 1.0e-06
        initial_clock_drift_sigma_sps: 1.0e-11
        initial_srp_coeff_sigma_m2_kg: 0.001
        process_accel_sigma_mps2: 1.0e-8
        process_srp_coeff_sigma_m2_kg_sqrt_s: 1.0e-09
        integration_step_s: 20.0
