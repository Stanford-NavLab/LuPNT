# Codecov configuration. Coverage is informational — it never fails CI or blocks PRs; it just
# tracks how much of the library the test suite exercises (C++ via gcov, Python via pytest-cov).
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

# The gcov/pytest reports already scope to library sources; ignore build trees, tests, examples,
# generated bindings, and third-party code so the number reflects the library itself.
ignore:
  - "build*"
  - "**/_deps/**"
  - "cpp/test/**"
  - "cpp/examples/**"
  - "python/bindings/**"
  - "python/test/**"
  - "**/*.pb.*"
