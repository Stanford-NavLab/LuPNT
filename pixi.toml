[workspace]
name = "lupnt"
version = "0.1.0"
description = "Lunar Positioning, Navigation, and Timing (PNT) library"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
# Build tools
cmake = ">=3.21"
ninja = "*"
make = "*"
compilers = "*"
git = "*"
clang-format = "18.*"
cmake-format = "*"
python-build = "*"

# Python
python = "3.11.*"
numpy = "<2.0.0"
pybind11 = "*"
mypy = "*"

# C++ libraries
boost-cpp = "*"
eigen = "3.4.0.*"
fmt = "*"
hdf5 = "*"
llvm-openmp = "*"
tbb = "*"
tbb-devel = "*"
nlohmann_json = "*"
spdlog = "*"
yaml-cpp = "*"
libjpeg-turbo = "*"
# Pin libjxl to 0.11.x: conda-forge's image stack (libtiff/opencv/gdal) links
# libjxl.so.0.11; letting the solver pick 0.12 breaks `import pylupnt` on Linux
# with "libjxl.so.0.11: cannot open shared object file".
libjxl = "0.11.*"
libtiff = "*"
gdal = "*"
libopencv = "*"
ffmpeg = "*"
libcxx = "18.*"
gfortran = "*"
gtsam = "*"
doxygen = "*"
pandoc = "*"

[pypi-dependencies]
bpy = "==4.5.11"
fastapi = "*"
h5py = "*"
ipykernel = "*"
kaleido = "*"
matplotlib = "*"
nbformat = "*"
numba = "*"
pandas = "*"
plotly = "*"
pre-commit = "*"
pymoo = "*"
pytest = "*"
pytest-cov = "*"
gcovr = "*"
requests = "*"
scikit-learn = "*"
sphinx = "*"
sphinx-rtd-theme = "*"
furo = "*"
exhale = "*"
breathe = "*"
nbsphinx = "*"
nbsphinx-link = "*"
lxml_html_clean = "*"
tqdm = "*"
uvicorn = "*"

[activation]
env = { LUPNT_DATA_PATH = "$PIXI_PROJECT_ROOT/data/LuPNT_data", PYTHONPATH = "$PIXI_PROJECT_ROOT/python", PECSIMPY_BASE_PATH = "$PIXI_PROJECT_ROOT/data/LuPNT_data/plasma", LUPNT_OUTPUT_PATH = "$PIXI_PROJECT_ROOT/output" }

# ---- Optional dev tooling -------------------------------------------------
# `orekit` (a JVM-based astrodynamics library, via the JCC Python wrapper) is
# only needed to *regenerate* the reference vectors used by the
# `*_orekit_reference*` tests (see cpp/test/data/orekit/README.md). Normal
# users/tests never need it, so it lives in its own feature/environment:
#   pixi run -e dev python cpp/test/data/orekit/gen_orekit_reference.py
[feature.orekit.dependencies]
orekit = "*"

[environments]
default = { solve-group = "default" }
dev = { features = ["orekit"], solve-group = "default" }

[tasks]
build         = { cmd = "cmake -S cpp -B build         -GNinja -DCMAKE_BUILD_TYPE=Release        && cmake --build build         --target lupnt" }
build-debug   = { cmd = "cmake -S cpp -B build-debug   -GNinja -DCMAKE_BUILD_TYPE=Debug          && cmake --build build-debug   --target lupnt" }
build-reldbg  = { cmd = "cmake -S cpp -B build-reldbg  -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build-reldbg  --target lupnt" }
build-py      = { cmd = "cmake -S python/bindings -B build-py         -GNinja -DCMAKE_BUILD_TYPE=Release        && cmake --build build-py         --target pylupnt-dev" }
build-py-debug  = { cmd = "cmake -S python/bindings -B build-py-debug   -GNinja -DCMAKE_BUILD_TYPE=Debug          && cmake --build build-py-debug   --target pylupnt-dev" }
build-py-reldbg = { cmd = "cmake -S python/bindings -B build-py-reldbg  -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build-py-reldbg  --target pylupnt-dev" }
build-docs    = { cmd = "python docs/make_docs.py", depends-on = ["build-py"] }
# Register a Jupyter kernel that runs the pixi env's Python *and* bakes in the activation
# env vars (PYTHONPATH -> python/, LUPNT_DATA_PATH, ...). VS Code / Jupyter launch the
# kernel's interpreter directly without pixi activation, so without these the kernel can't
# `import pylupnt` or find LuPNT_data. The helper derives all paths from the repo layout,
# so it is correct per-machine and works on both macOS and Linux/WSL. Re-run after moving
# the repo or switching machines.
install-kernel = { cmd = "python scripts/install_kernel.py", depends-on = ["build-py"] }
configure-test-cpp = { cmd = "cmake -S cpp/test -B build-cpp-test-pixi -GNinja -DCMAKE_BUILD_TYPE=Release" }
build-test-cpp = { cmd = "cmake --build build-cpp-test-pixi --target lupnt_tests", depends-on = ["configure-test-cpp"] }
test-cpp       = { cmd = "ctest --test-dir build-cpp-test-pixi --output-on-failure", depends-on = ["build-test-cpp"] }
test-cpp-ci    = { cmd = "ctest --test-dir build-cpp-test-pixi --output-on-failure -E 'data.eop_latest_iers|devices.space_comms|agents.gnss_constellation.setup_from_files|interfaces.antex_loader|interfaces.rinex_nav_loader|interfaces.sp3_loader|measurements.gnss_measurements.visibility|states.tle'", depends-on = ["build-test-cpp"] }
test-py        = { cmd = "pytest python/test", depends-on = ["build-py"] }
# ---- code coverage (Codecov) ----
# C++: build the test suite with gcov instrumentation (ENABLE_TEST_COVERAGE), run the CI test
# subset, and emit a Cobertura report over the library sources. Runs on Linux CI (gcc/gcov).
cov-cpp        = { cmd = "cmake -S cpp/test -B build-cov -GNinja -DCMAKE_BUILD_TYPE=Debug -DENABLE_TEST_COVERAGE=ON && cmake --build build-cov --target lupnt_tests && (ctest --test-dir build-cov --output-on-failure -E 'data.eop_latest_iers|devices.space_comms|agents.gnss_constellation.setup_from_files|interfaces.antex_loader|interfaces.rinex_nav_loader|interfaces.sp3_loader|measurements.gnss_measurements.visibility|states.tle' || true) && gcovr --root . --filter 'cpp/lupnt/' --exclude '.*\\.pb\\..*' --xml-pretty -o coverage-cpp.xml --gcov-ignore-parse-errors" }
# Python: coverage of the pylupnt package from the pytest suite.
cov-py         = { cmd = "pytest --cov=pylupnt --cov-report=xml:coverage-py.xml python/test", depends-on = ["build-py"] }
# Execute every python/examples/ex*.ipynb end-to-end and report a pass/fail summary.
# Outputs are not written back to the source notebooks. Forward extra args after `--`,
# e.g. `pixi run run-notebooks -- --only ex1 --timeout 600`.
run-notebooks  = { cmd = "python scripts/run_example_notebooks.py", depends-on = ["build-py", "install-kernel"] }
# Execute every python/examples/ex*.ipynb and write the cell outputs back IN PLACE, so the
# rendered docs (nbsphinx_execute = "never") show real results. Use before building the docs
# after example/API changes. Forward extra args after `--`, e.g.
# `pixi run render-notebooks -- --only ex1 ex4` or `-- --allow-errors`.
render-notebooks = { cmd = "python scripts/execute_notebooks_inplace.py", depends-on = ["build-py", "install-kernel"] }
# One-shot tutorial refresh: render notebooks in place (stages the interactive Plotly/Cesium
# HTML into build/doc_assets/ for lupnt-doc-assets) and THEN optimize the embedded PNGs.
# Order matters — a render regenerates full-size figures, so the optimize step must run after.
# Follow with `bash scripts/publish_doc_assets.sh` to push the interactive assets.
render-tutorials = { cmd = "python scripts/execute_notebooks_inplace.py && python scripts/optimize_notebook_images.py", depends-on = ["build-py", "install-kernel"] }
test           = { depends-on = ["test-cpp", "test-py"] }
build-examples = { cmd = "cmake -S cpp/examples -B build-examples-pixi -GNinja -DCMAKE_BUILD_TYPE=Release && cmake --build build-examples-pixi --target all_examples" }
format-check   = { cmd = "python scripts/check_format.py" }
install-test   = { cmd = "cmake -S cpp -B build-install-pixi -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PIXI_PROJECT_ROOT/install && cmake --build build-install-pixi --target install && test -f $PIXI_PROJECT_ROOT/install/lib/cmake/lupnt/lupntConfig.cmake && test -d $PIXI_PROJECT_ROOT/install/include/lupnt-0.1.0" }
download-gnss-test-data = { cmd = "python scripts/download_gnss_test_fixtures.py", depends-on = ["build-py"] }
